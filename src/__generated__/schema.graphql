}

"""
Um produto que o cliente compra, com o que o sistema estima do estoque dele.

`daysRemaining` é a estimativa ATUAL (dias até a previsão de esgotamento), e é
ela que o campo do formulário mostra preenchida — o cliente corrige um número em
vez de inventar um.
"""
type PortalStockItemType {
  productId: UUID!
  productName: String!
  sku: String
  factoryName: String!
  lastPurchaseDate: Date
  estimatedStockoutDate: Date
  daysRemaining: Int
  """Quando alguém informou este estoque pela última vez. Nulo = nunca."""
