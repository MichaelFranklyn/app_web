  ): PlatformTenantTypeConnectionResponse!
  platformTenant(id: UUID!, period: PlatformPeriodInput = null): PlatformTenantTypeDataResponse!
  """Pessoas da plataforma. Filtros aceitos em `input.filters`: `company_id`
  (recorta por empresa), `search` (nome ou e-mail) e `role`."""
  platformUsers(input: BaseListInput!): PlatformUserTypeConnectionResponse!
  """Uma pessoa, para a ficha do console."""
  platformUser(id: UUID!): PlatformUserTypeDataResponse!
  """O que está falhando ou demorando, por operação."""
  platformOperationHealth(
    period: PlatformPeriodInput = null
  ): OperationHealthReportTypeDataResponse!
  """Trilha do SU. Filtro aceito: `target_company_id`."""
  platformAuditLogs(input: BaseListInput!): PlatformAuditLogTypeConnectionResponse!
  platformHealth: PlatformHealthTypeDataResponse!
  """A equipe da plataforma (SU e suporte), inclusive quem está desativado.

  **Só o SU lê.** O suporte não precisa da lista para trabalhar, e mantê-la fora
  do alcance dele evita entregar o mapa de quem tem acesso total — que é a
  primeira coisa que se procura ao tentar escalar privilégio."""
  platformStaff: PlatformStaffListDataResponse!
}

"""Suspende ou reativa a empresa inteira. Não é exclusão: os dados ficam
intactos e o que muda é o direito de entrar. O motivo é obrigatório ao
suspender — é ele que a trilha mostra quando alguém for investigar."""
