# ── Faturamento: as duplicatas do período ───────────────────────────────

"""
Em que pé está a parcela. `PAID` ganha de `OVERDUE` mesmo com a data vencida —
quem quitou em atraso não continua devendo.
"""
enum BillingSituation {
  DUE
  OVERDUE
  PAID
}

"Uma duplicata do período, com o pedido de onde ela saiu."
type BillingInstallmentRow {
  installmentId: UUID!
  orderId: UUID!
  sequence: Int!
  clientId: UUID!
  clientName: String!
  factoryId: UUID!
  factoryName: String!
  sellerId: UUID!
  sellerName: String!
  "Quando a fábrica faturou o pedido que gerou esta parcela."
  invoicedAt: Date
  dueDate: Date
  amount: Decimal!
  commissionAmount: Decimal!
  situation: BillingSituation!
  paidAt: Date
  "Dias de atraso; 0 quando a parcela não está vencida."
  daysOverdue: Int!
  isCommissionReceived: Boolean!
}

"""
As parcelas que VENCEM no período, e o fechamento delas. Recorte por `dueDate`
(agenda de cobrança), diferente da aba Vendas, que recorta por `invoicedAt`.
"""
type BillingReportType {
  rows: [BillingInstallmentRow!]!
  installmentCount: Int!
  "Pedidos distintos representados nas parcelas."
  orderCount: Int!
  totalAmount: Decimal!
  paidAmount: Decimal!
  dueAmount: Decimal!
  overdueAmount: Decimal!
  overdueCount: Int!
  commissionAmount: Decimal!
}

# ── Fábricas por pedido ─────────────────────────────────────────────────

"""
Uma fábrica e o que foi colocado nela no período (pela data do pedido, só o que
virou pedido de verdade). `share` é a fatia dela no total do período.
"""
type FactoryOrdersRow {
  entityId: UUID!
  entityName: String!
  orderCount: Int!
  totalAmount: Decimal!
  avgTicket: Decimal!
  "Clientes distintos que compraram desta fábrica no período."
  clientCount: Int!
  invoicedCount: Int!
  invoicedAmount: Decimal!
  commissionAmount: Decimal!
  lastOrderDate: Date
  share: Float!
}

# ── Situação da carteira ────────────────────────────────────────────────

"""
Situação do cliente medida contra o PRÓPRIO ritmo de compra: `ACTIVE` está
dentro do ciclo dele, `AT_RISK` passou do ciclo, `INACTIVE` passou do dobro.
`NEW` é quem só comprou uma vez, e há pouco tempo; `NEVER`, quem nunca comprou.
"""
enum ClientWalletSituation {
  ACTIVE
  AT_RISK
  INACTIVE
  NEW
  NEVER
}

"Um cliente da carteira e a situação em que ele está hoje."
type WalletStatusRow {
  clientId: UUID!
  "Id do vínculo na carteira (`company_clients`) — a chave da rota /clients/[id]."
  companyClientId: UUID
  clientName: String!
  city: String
  state: String
  situation: ClientWalletSituation!
  lastOrderDate: Date
  daysSinceLastOrder: Int
  "Intervalo médio entre as compras do cliente; nulo com menos de 2 pedidos."
  avgIntervalDays: Float
  "Dias parados ÷ intervalo médio. Acima de 1 = atrasado. Nulo sem ritmo próprio."
  riskRatio: Float
  "Pedidos do cliente em toda a história, não só no período."
  orderCount: Int!
  periodOrderCount: Int!
  periodAmount: Decimal!
}

"""
A carteira inteira com a situação de cada cliente. A situação é um retrato de
HOJE; o período do filtro governa apenas as colunas "no período".
"""
type WalletStatusReportType {
  rows: [WalletStatusRow!]!
  totalClients: Int!
  activeClients: Int!
  atRiskClients: Int!
  inactiveClients: Int!
  neverBoughtClients: Int!
  newClients: Int!
  periodAmount: Decimal!
}

# ── Últimas compras por cliente e fábrica ───────────────────────────────

"""
A última compra de um cliente em UMA fábrica. Uma linha por par cliente×fábrica:
o mesmo cliente aparece tantas vezes quantas fábricas ele tem no histórico ou no
vínculo. Orçamento e cancelado não contam como compra.
"""
type ClientFactoryPurchaseRow {
  clientId: UUID!
  "Id do vínculo na carteira (`company_clients`) — a chave da rota /clients/[id]."
  companyClientId: UUID!
  clientName: String!
  city: String
  state: String
  factoryId: UUID!
  "Como a empresa chama a fábrica (o apelido do vínculo, quando existe)."
  factoryName: String!
  "Quem atende o par hoje; sem vínculo ativo, quem vendeu da última vez."
  sellerName: String
  priority: String
  visitFrequencyDays: Int
  """
  Há vínculo ativo deste cliente nesta fábrica. `false` = o vínculo foi desfeito
  e a linha existe pelo histórico de compras.
  """
  isLinked: Boolean!
  """
  Situação do par medida contra o ritmo de compra DESTA fábrica — é ela que
  revela o cliente em dia numa fábrica e parado em outra.
  """
  situation: ClientWalletSituation!
  "O pedido da última compra, para abrir e ver o que foi comprado. Nulo se nunca comprou."
  lastOrderId: UUID
  lastOrderDate: Date
  lastOrderAmount: Decimal!
  lastOrderStatus: OrderStatus
  "Quando a fábrica faturou a última compra; nulo se ainda não faturou."
  lastInvoicedAt: Date
  daysSinceLastOrder: Int
  "Intervalo médio entre as compras NESTA fábrica; nulo com menos de 2 pedidos."
  avgIntervalDays: Float
  "Dias parado ÷ intervalo médio. Acima de 1 = atrasado. Nulo sem ritmo próprio."
  riskRatio: Float
  "Compras do par em toda a história, não só no período."
  orderCount: Int!
  "Quanto o par comprou em toda a história."
  historyAmount: Decimal!
  periodOrderCount: Int!
  periodAmount: Decimal!
}

"""
As últimas compras de todos os pares cliente×fábrica. Sem corte de top-N: quem
parou de comprar é justamente quem cairia fora de um resumo.
"""
type ClientFactoryPurchasesReportType {
  rows: [ClientFactoryPurchaseRow!]!
  totalRows: Int!
  "Clientes distintos representados nas linhas."
  clientCount: Int!
  "Fábricas distintas representadas nas linhas."
  factoryCount: Int!
  "Pares cadastrados que nunca compraram daquela fábrica."
  neverBoughtRows: Int!
  atRiskRows: Int!
  inactiveRows: Int!
  periodOrderCount: Int!
  periodAmount: Decimal!
}

# ── Curva ABC de clientes ───────────────────────────────────────────────

"Classe do cliente na curva de Pareto: A = os primeiros 80% do faturamento."
enum AbcClass {
  A
  B
  C
}

"Um cliente na curva ABC, do maior faturamento para o menor."
type ClientAbcRow {
  clientId: UUID!
  clientName: String!
  rank: Int!
  totalAmount: Decimal!
  orderCount: Int!
  commissionAmount: Decimal!
  share: Float!
  cumulativeShare: Float!
  abcClass: AbcClass!
  lastOrderDate: Date
}


# ── O motor de rotina acertou? ──────────────────────────────────────────

"""
A faixa de score em que a recomendação caiu, na mesma régua do motor:
`URGENT_TOP` e `URGENT` pagam deslocamento (>= 45), `ATTENTION` é a fila do
telefone e `CALM` é o cliente tranquilo.
"""
enum VisitScoreBand {
  URGENT_TOP
  URGENT
  ATTENTION
  CALM
}

"Um recorte do acerto: faixa de score × tipo de toque."
type VisitAccuracyRow {
  band: VisitScoreBand!
  contactType: VisitContactType!
  "Recomendações que o motor fez no período (o denominador de tudo)."
  planned: Int!
  "Quantas o vendedor de fato trabalhou (qualquer desfecho)."
  worked: Int!
  "Quantas viraram pedido do cliente dentro da janela de conversão."
  converted: Int!
  executionRate: Float!
  conversionRate: Float!
  orderAmount: Decimal!
}

"""
Se as recomendações do motor viram pedido — a única leitura que diz se a
priorização está funcionando. `lift` compara a taxa do motor com a linha de base
da carteira: 1.0 significa que priorizar não mudou nada em relação ao acaso.
"""
type VisitAccuracyReportType {
  rows: [VisitAccuracyRow!]!
  planned: Int!
  worked: Int!
  converted: Int!
  conversionRate: Float!
  orderAmount: Decimal!
  "Chance de um cliente da carteira comprar numa janela igual, sem recomendação."
  baselineRate: Float!
  "Fração das recomendações que o vendedor de fato trabalhou."
  executionRate: Float!
  "Razão entre a taxa do motor e a linha de base. Nulo quando não há base medida."
  lift: Float
  """
  O `lift` pode ser lido como julgamento do motor?

  Falso quando a rotina quase não foi executada (ver `MIN_EXECUTION_FOR_LIFT`).
  Aí o número compara compra espontânea de quem foi apontado contra a de quem
  não foi — e como o motor aponta justamente quem PAROU de comprar, ele sai
  abaixo de 1 por acerto do score, não por erro. Com isto falso, a leitura certa
  é "a rotina não está sendo executada", nunca "o score está errado".
  """
  isLiftReliable: Boolean!
}

extend type Query {
  """
  As duplicatas que vencem no período (recorte por vencimento), com o fechamento
  do que está pago, a vencer e vencido.
  """
  billingReport(from: Date = null, to: Date = null, sellerId: UUID = null): BillingReportType!

  """
  Uma linha por fábrica com o que foi colocado nela no período. Sem corte de
  top-N: é um documento de conferência.
  """
  factoryOrdersReport(from: Date = null, to: Date = null, sellerId: UUID = null): [FactoryOrdersRow!]!

  """
  A carteira de clientes com a situação de cada um. Sem corte de top-N.
  """
  walletStatusReport(from: Date = null, to: Date = null, sellerId: UUID = null): WalletStatusReportType!

  """
  Curva ABC dos clientes pelo FATURADO no período (mesma base da aba Vendas),
  com a fatia de cada um e a acumulada.
  """
  clientAbcCurve(from: Date = null, to: Date = null, sellerId: UUID = null): [ClientAbcRow!]!

  """
  A última compra de cada cliente EM CADA FÁBRICA, uma linha por par. A situação
  e o ritmo são de HOJE e da história inteira do par; o período governa só as
  colunas "no período". Sem corte de top-N.
  """
  clientFactoryPurchasesReport(from: Date = null, to: Date = null, sellerId: UUID = null): ClientFactoryPurchasesReportType!

  """
  Das recomendações que o motor fez no período, quantas viraram pedido — por
  faixa de score e por tipo de toque, com a linha de base da carteira para
  comparação. `windowDays` é a janela de crédito do pedido ao toque.
  """
  visitAccuracyReport(from: Date = null, to: Date = null, sellerId: UUID = null, windowDays: Int = 7): VisitAccuracyReportType!
}

input CreateSellerClientFactoryInput {
  sellerId: UUID!
  factoryId: UUID!
  clientId: UUID!
  priceTierId: UUID!
  priority: String = null
  visitFrequencyDays: Int = null
  notes: String = null
  lastVisitDate: DateTime = null
  """
  Assume um vínculo que já é de OUTRO vendedor (ele saiu, deixou de atender esta
  fábrica...). O atendimento passa para o vendedor informado e as visitas ainda
  pendentes vão para a agenda dele; pedidos, comissões e visitas já concluídas
  continuam no histórico do vendedor anterior. Só gestor pode transferir.
  """
  transferFromCurrentSeller: Boolean = false
}

type SellerClientFactoryType {
  id: UUID!
  sellerId: UUID!
  factoryId: UUID!
  companyId: UUID!
  clientId: UUID!
  priceTierId: UUID
  priority: String
  visitFrequencyDays: Int
  """
  Intervalo médio (dias) entre os últimos PEDIDOS deste cliente nesta fábrica,
  calculado pelo job de estoque. É a MEDIÇÃO do ritmo de compra e, desde
  2026-08-04, ela ARBITRA a cadência: quando contradiz o visitFrequencyDays
  digitado, é ela que vale (ver o campo `cadence`).
  """
  orderIntervalDays: Int
  """Data do último pedido deste cliente nesta fábrica."""
  lastPurchaseDate: Date
  """Quantos pedidos existem no histórico do vínculo (sustentam a média acima)."""
  orderCount: Int!
  """
  De quanto em quanto tempo este cliente compra, de onde esse número saiu, e o
  aviso quando a estimativa do vendedor não bate com os pedidos.
  """
  cadence: CadenceType
  notes: String
  lastVisitDate: DateTime
  """Último toque de qualquer tipo — visita presencial OU contato remoto."""
  lastContactDate: Date
  """
  Faturamento mais recente deste vínculo — só os pedidos deste vendedor para
  este cliente nesta fábrica. Nulo enquanto nenhum pedido do vínculo foi faturado.
  """
  lastInvoiceDate: Date
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  company: CompanyType
  client: ClientType
  seller: SellerType
  factory: FactoryType
  priceTier: PriceTierType
  latestVisitScore: ClientVisitScoreType
}

"""
O ritmo de compra de um vínculo e a procedência dele.

Existe porque três fontes disputam esse número — a recorrência real dos pedidos,
a cobertura que o vendedor declarou no fechamento ("esse pedido dura um mês") e
a frequência de visita cadastrada — e nem sempre concordam. Devolver só o número
escondia do vendedor justamente a informação que ele não tem como ter: o
intervalo real entre os últimos doze pedidos daquele cliente.
"""
type CadenceType {
  """Dias entre compras. Nulo quando não há base nenhuma para estimar."""
  days: Int
  """
  `observada` (pedidos reais) | `declarada` (estimativa do vendedor) |
  `combinada` (cadastro) | `tipica` (mediana da fábrica, quando o cliente ainda
  não tem histórico próprio) | `desconhecida`.
  """
  source: String!
  """A estimativa do vendedor contradiz os pedidos. Quando true, `days` já é a observada."""
  isDivergent: Boolean!
  declaredDays: Int
  observedDays: Int
  """Quando o cliente deve precisar repor. Nulo sem base para prever."""
  nextOrderDue: Date
  """Quando o vendedor deveria estar lá — antes de faltar, não no dia em que faltou."""
  nextVisitEstimate: Date
  """O aviso pronto para a tela quando há divergência. Nulo quando não há."""
  divergenceMessage: String
}

