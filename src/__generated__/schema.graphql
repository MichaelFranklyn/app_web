"""
Quem manda o link e para qual cliente ele aponta.

Existe para o cliente saber de quem é a página que abriu: um link recebido no
WhatsApp, sem cabeçalho nenhum, é indistinguível de golpe. Por isso o nome e a
logo do escritório vêm junto do nome dele.
"""
type PortalProfileType {
  """Nome fantasia do cliente; a razão social quando não houver."""
  clientName: String!
  clientCity: String
  clientState: String
  """Nome do escritório que atende o cliente."""
  companyName: String!
  companyLogoUrl: String
}

"""
Um pedido, como o CLIENTE o vê.

Deliberadamente mais pobre que `OrderType`: não há comissão, vendedor, base de
cálculo, nem nada que descreva a operação do escritório. O que sai daqui é o que
o cliente já saberia olhando a própria nota — mais o acompanhamento da entrega,
que é o motivo de a página existir.
"""
type PortalOrderType {
  id: UUID!
  orderDate: Date!
  """Nome da fábrica (fantasia, ou razão social quando não houver)."""
  factoryName: String!
  """Valor das mercadorias, sem IPI."""
  totalAmount: Decimal!
  """IPI do pedido. Total a pagar = totalAmount + ipiAmount."""
  ipiAmount: Decimal!
  status: OrderStatus!
  invoicedAt: Date
  deliveredAt: Date
  """Previsão de entrega = invoicedAt + prazo estimado. Nula antes do faturamento."""
  estimatedDeliveryDate: Date
}

"""
Um item do pedido, como o cliente o vê.

Sem nível de preço e sem desconto: aquilo descreve a negociação entre o
escritório e a fábrica, não a compra. O que fica é o que estaria na nota —
quanto veio, a que preço, quanto deu.
"""
type PortalOrderItemType {
  id: UUID!
  productName: String!
  sku: String
  """Unidades pedidas (o pedido é sempre por UNIDADE, não por embalagem)."""
  quantity: Decimal!
  unitPrice: Decimal!
  """Sem IPI — o IPI do item vem separado, como na nota."""
  subtotal: Decimal!
  ipiAmount: Decimal!
}

"""Uma parcela do pedido faturado. Sem nada de comissão."""
type PortalInstallmentType {
  sequence: Int!
  amount: Decimal!
  dueDate: Date
  status: InstallmentStatus!
  paidAt: Date
}

type PortalOrderDetailType {
  id: UUID!
  orderDate: Date!
  factoryName: String!
  totalAmount: Decimal!
  ipiAmount: Decimal!
  status: OrderStatus!
  invoicedAt: Date
  deliveredAt: Date
  estimatedDeliveryDate: Date
  """Prazo de pagamento combinado (ex.: "30/60/90"). Nulo se não houver."""
  paymentTermName: String
  items: [PortalOrderItemType!]!
  """Vazio até o faturamento: é ele que gera as parcelas."""
  installments: [PortalInstallmentType!]!
}

type PortalOrderDetailTypeDataResponse {
  status: Boolean!
  code: Int!
  message: String!
  data: PortalOrderDetailType
}

"""Total comprado num mês. `month` é sempre o dia 1."""
type PortalMonthTotalType {
  month: Date!
  amount: Decimal!
  orderCount: Int!
}

type PortalFactoryTotalType {
  factoryName: String!
  amount: Decimal!
  orderCount: Int!
}

"""
O retrato das compras: quanto por mês, quanto por fábrica.

Os meses vêm CONTÍNUOS, incluindo os vazios — num gráfico, pular o mês em que
não houve compra achata justamente o buraco que o cliente quer enxergar.
"""
type PortalPurchaseSummaryType {
  months: [PortalMonthTotalType!]!
  factories: [PortalFactoryTotalType!]!
  totalAmount: Decimal!
  orderCount: Int!
  averageTicket: Decimal!
}

