"""Recurso que um plano pode incluir. O front usa este vocabulário para decidir
o que mostrar — e o backend, para decidir o que responder. Ver `core/domain/plans.py`."""
enum PlanFeature {
  ROUTINES
  ANALYTICS
  REPORTS
  BULK_IMPORT
  GOALS
  COMMISSIONS
  NOTIFICATIONS
}

"""Teto de volume que um plano impõe."""
enum PlanLimit {
  USERS
  SELLERS
  CLIENTS
  FACTORIES
}

"""Um teto e quanto dele já foi ocupado. `limit` nulo = ilimitado; nesse caso
`used` continua vindo, porque a tela mostra o número de qualquer forma."""
type PlanLimitUsageType {
  key: PlanLimit!
  """Nome do recurso no plural, como se diz ao usuário ("vendedores")."""
  label: String!
  limit: Int
  used: Int!
  """Verdadeiro quando não cabe mais nenhum. É isto que desabilita o botão de
  criar — o front não deve recalcular a comparação por conta própria."""
  isAtLimit: Boolean!
}

"""O plano da empresa do usuário logado, já com os overrides do tenant
aplicados. Leitura aberta a qualquer papel: esconder o próprio contrato faria
todo bloqueio parecer defeito."""
type MyPlanType {
  code: String!
  """Nome comercial do plano ("Básico", "Pro")."""
  label: String!
  features: [PlanFeature!]!
  limits: [PlanLimitUsageType!]!
}

type MyPlanTypeDataResponse {
  status: Boolean!
  code: Int!
  message: String!
  data: MyPlanType
}

