"""
Link ativo do portal de um cliente. Lado do ESCRITÓRIO — quem lê isto é o
vendedor, não o cliente.
"""
type ClientPortalLinkType {
  """
  A URL completa. Só vem preenchida na emissão: o que fica guardado é o hash, e
  um link já emitido não pode ser mostrado de novo — só substituído por outro.
  """
  url: String
  expiresAt: DateTime!
  """Última vez que o cliente abriu a página. Nulo = ele nunca entrou."""
  lastAccessedAt: DateTime
  createdAt: DateTime!
}

type ClientPortalLinkTypeDataResponse {
  status: Boolean!
  code: Int!
  message: String!
  data: ClientPortalLinkType
}

extend type Query {
  """
  Dados do cliente do link. Autenticada pelo header `X-Portal-Token`, não por
  sessão: quem chama aqui não tem conta no sistema.
  """
  portalProfile: PortalProfileTypeDataResponse!
  """
  Pedidos do cliente do link, do mais recente para o mais antigo.

  Traz o que o cliente comprou no escritório inteiro — todas as fábricas, todos
  os vendedores —, porque é isso que "tudo que já comprei" significa para ele.
  Rascunhos e orçamentos ficam de fora: são conversa interna até virarem pedido.
  """
  portalOrders(input: BaseListInput!): PortalOrderTypeConnectionResponse!
  """
  Um pedido com os itens e as parcelas. O id é conferido contra o cliente do
  token: endereço de pedido alheio responde "não encontrado", não o pedido.
  """
  portalOrder(id: UUID!): PortalOrderDetailTypeDataResponse!
  """Quanto o cliente comprou por mês e por fábrica — a base dos gráficos."""
  portalPurchaseSummary(months: Int = 12): PortalPurchaseSummaryTypeDataResponse!
  """Os produtos que o cliente acompanha, com a estimativa de estoque atual."""
  portalStock: PortalStockItemTypeListResponse!
  """Link ativo do cliente, para o escritório. Nulo se não houver nenhum vivo."""
  clientPortalLink(companyClientId: UUID!): ClientPortalLinkTypeDataResponse!
}

extend type Mutation {
  """
  O cliente informa quanto tempo cada produto ainda dura na loja dele.

  Vale o mesmo que o vendedor olhando a prateleira — é o dado que corrige a
  previsão de esgotamento e recalcula o score do vínculo na hora. A observação
  fica marcada com origem CLIENTE, para o vendedor saber de onde veio.
  """
  submitPortalStock(input: SubmitPortalStockInput!): BaseResponse!
  """Emite um link novo e derruba o anterior. Devolve a URL — única vez em que ela existe."""
  issueClientPortalLink(companyClientId: UUID!): ClientPortalLinkTypeDataResponse!
  """Corta o link ativo. Use quando ele tiver ido parar onde não devia."""
  revokeClientPortalLink(companyClientId: UUID!): BaseResponse!
}

