}

"""
Uma célula da matriz: o que este cliente comprou desta fábrica no período.
`isLinked: false` é o cliente que não tem vínculo nessa fábrica — a célula existe
só para as colunas não escorregarem de posição na linha.
"""
type PositivationCellType {
  factoryId: UUID!
  factoryName: String!
  isLinked: Boolean!
  isPositivated: Boolean!
  orderCount: Int!
  totalAmount: Decimal!
  lastOrderDate: Date
}

"""Uma LINHA da matriz: um cliente da carteira e suas fábricas."""
type PositivationRowType {
  clientId: UUID!
  """Id do vínculo na carteira (`company_clients`) — a chave da rota /clients/[id]."""
  companyClientId: UUID
  clientName: String!
  sellerId: UUID!
  sellerName: String!
  """Uma célula por coluna, na mesma ordem de `factories`."""
  cells: [PositivationCellType!]!
  linkedFactories: Int!
  positivatedFactories: Int!
  orderCount: Int!
  totalAmount: Decimal!
  lastOrderDate: Date
}

"""
Positivação da carteira no período. `clientPositivationRate` é a fatia dos
CLIENTES que compraram algo; `pairPositivationRate`, a dos VÍNCULOS
(cliente×fábrica) que giraram — a segunda revela o cliente fiel a uma fábrica e
fechado para as outras.
"""
type PositivationReportType {
  factories: [PositivationFactoryType!]!
  rows: [PositivationRowType!]!
  walletClients: Int!
  positivatedClients: Int!
  clientPositivationRate: Float!
  linkedPairs: Int!
  positivatedPairs: Int!
  pairPositivationRate: Float!
  totalAmount: Decimal!
}

