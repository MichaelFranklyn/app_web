"""Governança da relação comercial. Campo omitido não é alterado; campo
enviado como `null` REMOVE o valor (é assim que se tira um teto ou o prazo do
teste). O cadastro da empresa em si não se edita por aqui.

ATENÇÃO — os campos NÃO têm `= null` de propósito, ao contrário dos demais
inputs de update do schema. Com o default, o graphql-core preenche as chaves
omitidas com nulo e o resolver perde a distinção entre "não mexa" e "apague":
toda chamada tentaria zerar o plano, que é NOT NULL no banco."""
input UpdateTenantPlanInput {
  plan: String
  trialEndsAt: Date
  maxUsers: Int
  maxSellers: Int
}

