type VisitScheduleItemType {
  id: UUID!
  scheduleDayId: UUID!
  sellerClientFactoryId: UUID!
  """Preenchido quando a parada veio de um compromisso de ROTA FIXA (contrato), não de uma escolha do motor."""
  fixedScheduleId: UUID
  plannedOrder: Int!
  """Visita presencial ou contato remoto (ligação/WhatsApp)."""
  contactType: VisitContactType!
  """Minutos de DESLOCAMENTO até esta parada (não é a duração da visita)."""
  estimatedTravelMin: Int
  """Hora prevista de início da visita ("09:40"), já respeitando a abertura do expediente e o almoço. Nulo em contato remoto e quando o dia não tem trajeto calculado."""
  plannedStartTime: String
  """Hora prevista de término da visita ("10:10")."""
  plannedEndTime: String
  """Minutos que a parada ocupa na agenda — o `avgVisitDurationMin` da configuração do vendedor."""
  visitDurationMin: Int
  suggestedProducts: [JSON!]
  stockoutAlerts: [JSON!]
  """
  O pedido que dava para montar quando a rotina foi planejada, contra o mínimo
  da fábrica. Congelado de propósito: é o que EXPLICA a decisão do motor. Nulo
  quando a fábrica não tem mínimo cadastrado ou o vínculo ainda não tem cesta.
  """
  viability: VisitViabilityType
  status: VisitStatus!
  outcome: VisitOutcome
  outcomeReason: String
  checkinLat: Decimal
  checkinLng: Decimal
  actualVisitAt: DateTime
  nextVisitSuggestion: Date
  notes: String
  """Esta visita tomou a jornada inteira: as outras paradas do dia saíram por causa dela."""
  isWholeDay: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
  day: VisitScheduleDayType
  clientFactoryLink: SellerClientFactoryType
  """Fábricas que motivaram a visita (sugestão do sistema, score alto)."""
  focusFactories: [VisitItemFactoryType!]!
  """Fábricas efetivamente tratadas, derivadas das observações de estoque registradas."""
  treatedFactories: [FactoryType!]!
}

"""Cliente da região que vale entrar na mesma viagem da visita promovida."""
type NearbyVisitCandidateType {
  """Vínculo (vendedor × cliente × fábrica) que vira a visita, se escolhido."""
  sellerClientFactoryId: UUID!
  client: ClientType
  factory: FactoryType
  """Distância em linha reta até o cliente que motivou a viagem, em km."""
  distanceKm: Float!
  scoreTotal: Decimal!
  """Score na faixa "Urgente" (>= 45) — os demais estão em "Atenção"."""
  isUrgent: Boolean!
}

"""O que acontece com o dia se este contato virar visita presencial."""
type VisitPromotionPreviewType {
  """Dá para ir, visitar e voltar dentro da jornada?"""
  isReachable: Boolean!
  """A visita convive com as paradas já marcadas para o dia?"""
  fitsWithExisting: Boolean!
  """Entrando ela, o resto do dia não cabe mais — exige confirmação."""
  occupiesWholeDay: Boolean!
  """Minutos de deslocamento até o cliente (só a ida)."""
  travelMinOneWay: Int!
  distanceKm: Float!
  """Quantas visitas já marcadas sairiam do caminho."""
  displacedCount: Int!
  """Quem mais está naquela região merecendo visita."""
  nearby: [NearbyVisitCandidateType!]!
}

"""O que fazer com as visitas que a viagem expulsa do dia."""
enum DisplacedStopStrategy {
  """Viram ligação no mesmo dia — o cliente continua sendo tocado."""
  TO_REMOTE
  """Vão para os próximos dias com vaga; sem vaga, viram ligação."""
  NEXT_DAYS
}

input PromoteContactToVisitInput {
  itemId: UUID!
  """Confirmação do aviso "esta viagem ocupa o dia inteiro"."""
  confirmWholeDay: Boolean = false
  displacedStrategy: DisplacedStopStrategy = TO_REMOTE
  """Vínculos da região que entram na mesma viagem."""
  includeLinkIds: [UUID!] = []
  """Levar a viagem para outro dia. Ausente = o dia em que o contato já está."""
  targetDate: Date = null
}

"""Um produto que ajudaria a fechar o pedido mínimo."""
type ViabilitySuggestionType {
  productId: UUID!
  productName: String
  sku: String
  """Quantidade média que este cliente costuma comprar deste produto."""
  quantity: Decimal!
  """Quanto essa quantidade acrescenta ao pedido."""
  value: Decimal!
  """Dias até acabar na loja. Negativo = já acabou."""
  daysUntilOut: Int
}

"""
O pedido possível de um cliente contra o mínimo da fábrica, como estava no
momento do planejamento.

Existe porque o mínimo deixou de ser só um erro na confirmação e virou insumo da
rotina: cliente em ruptura cuja reposição não fecha o mínimo não faz pedido, e
mandar o vendedor até lá hoje queima a viagem.
"""
type VisitViabilityType {
  """`fecha` | `quase` | `longe`."""
  status: String!
  """Valor da reposição devida hoje."""
  basketValue: Decimal!
  minimumAmount: Decimal!
  """Quanto falta para o pedido existir. Zero quando já fecha."""
  missingAmount: Decimal!
  """
  Dia em que a cesta deve cruzar o mínimo. Só em `longe` — é o que transforma
  "não vá" em "vá no dia 22". Nulo quando o cliente não fecha o mínimo sozinho
  nem esperando (caso de conversa, não de espera).
  """
  readyOn: Date
  """Do que acaba primeiro para o mais distante — nunca do mais caro."""
  suggestions: [ViabilitySuggestionType!]!
}

