  avgTicket: Decimal!
  """Pedidos que a fábrica já faturou (invoicedAt preenchido)."""
  invoicedOrders: Int!
  """Valor somado dos pedidos já faturados — o total faturado no recorte filtrado."""
  invoicedAmount: Decimal!
  """Comissão somada dos pedidos já faturados no recorte."""
  commissionAmount: Decimal!
}

input UpdateOrderInput {
  """
  Data do pedido. Só pode ser corrigida enquanto o pedido NÃO foi faturado: depois
  do faturamento ela já entrou nas parcelas e na comissão, e a correção é feita
  por `reviseOrderInvoice`.
  """
  orderDate: Date = null
  status: OrderStatus = null
  paymentTermId: UUID = null
  notes: String = null
  fileUrl: String = null
  isFileParsed: Boolean = null
  freightType: FreightType = null
  deliveryEstimateDays: Int = null
  coverageDays: Int = null
}

input InvoiceOrderInput {
  invoicedAt: Date!
  paymentTermId: UUID = null
  """Número da nota fiscal da fábrica. Opcional: a nota nem sempre está em mãos na hora de lançar; pode ser preenchida depois em `reviseOrderInvoice`."""
  invoiceNumber: String = null
  """Faturamento PARCIAL: quantidade faturada (em unidades) por item, quando a fábrica não tinha tudo em estoque. Itens do pedido não listados aqui são faturados por inteiro. A sobra (pedida − faturada) de cada item vira um pedido-filho (backorder) CONFIRMADO, faturado depois. Omitir a lista = fatura o pedido inteiro (comportamento normal)."""
  items: [InvoiceOrderItemInput!] = null
  """No faturamento parcial, CANCELA a sobra em vez de gerar o pedido-filho (backorder): o que não foi faturado sai do pedido e não fica pendente. Só tem efeito junto com `items`."""
  cancelRemainder: Boolean = false
}

"""
Correção de um faturamento JÁ lançado (data errada, prazo errado, entrega
digitada errada). Campo ausente = mantém o que está gravado; para APAGAR um
valor use o `clear*` correspondente. Mudar a data ou o prazo REFAZ as parcelas:
quando a quantidade de parcelas continua a mesma, as baixas já lançadas são
preservadas; quando muda, é preciso confirmar com `force`. Para corrigir as
QUANTIDADES faturadas (faturou cheio e foi parcial), use `uninvoiceOrder` e
fature de novo.
"""
input ReviseOrderInvoiceInput {
  invoicedAt: Date = null
  """Número da nota fiscal da fábrica. É por aqui que a nota é preenchida depois do faturamento."""
  invoiceNumber: String = null
  """Apaga o número da nota (lançado errado). Sem isto, nulo significa "não mexer"."""
  clearInvoiceNumber: Boolean = false
  paymentTermId: UUID = null
  """Deixa o pedido SEM prazo (à vista). Só em fábrica que paga comissão no faturamento."""
  clearPaymentTerm: Boolean = false
  deliveryEstimateDays: Int = null
  coverageDays: Int = null
  """Remove a previsão de entrega (pedido sem prazo estimado)."""
  clearDeliveryEstimate: Boolean = false
  """Corrige a data em que a mercadoria chegou. Só para pedido já entregue."""
  deliveredAt: Date = null
  """Desfaz uma entrega marcada por engano: volta para faturado, aguardando entrega."""
  clearDelivery: Boolean = false
  """Autoriza refazer as parcelas mesmo apagando baixas de pagamento/comissão."""
  force: Boolean = false
}

input InvoiceOrderItemInput {
  orderItemId: UUID!
  """Quantidade faturada em unidades; 0 ≤ faturada ≤ quantidade pedida do item."""
  invoicedQuantity: Decimal!
}

"""Uma parcela de comissão (linha da tela de Comissões).

Os campos principais (`amount`, `status`, `receiveDate`…) são do nível de quem
está olhando: para o gestor, o que a FÁBRICA deve ao escritório; para o
vendedor, a fatia dele. Os campos `seller*` são sempre o nível do vendedor.
"""
type CommissionRowType {
  orderId: UUID!
  installmentId: UUID!
  sequence: Int!
  orderDate: Date!
  invoicedAt: Date
  """Nota fiscal do pedido — a chave pela qual a fábrica identifica o repasse na planilha dela."""
  invoiceNumber: String
  dueDate: Date
  paidAt: Date
  installmentAmount: Decimal!
  """Negativo quando `status` é "chargeback": comissão paga que volta por calote do cliente."""
  amount: Decimal!
  """pending | receivable | received | cancelled | chargeback | chargeback_settled | refund"""
  status: String!
  receiveDate: Date
  isReceivable: Boolean!
  isReceived: Boolean!
  isReconciled: Boolean!
  reconciledAt: Date
  """Boleto vencido e não pago (derivado da data)."""
  isOverdue: Boolean!
  """Quando o boleto virou calote."""
  defaultedAt: Date
  """A fábrica já descontou o estorno do escritório."""
  isChargebackSettled: Boolean!
  chargebackSettledAt: Date
  sellerAmount: Decimal!
  sellerStatus: String!
  sellerReceiveDate: Date
  isSellerPaid: Boolean!
  """Mês escolhido para descontar o estorno do vendedor; nulo = ainda na fila."""
  sellerChargebackMonth: Date
  """O escritório já descontou o estorno do vendedor."""
  isSellerChargebackSettled: Boolean!
  sellerChargebackSettledAt: Date
  order: OrderType
  client: ClientType
  factory: FactoryType
  seller: SellerType
}

type CommissionSummaryType {
  rows: [CommissionRowType!]!
  """Data mais recente em que alguma comissão cai, medida antes do recorte de período: é por ela que a tela sabe em que mês abrir."""
  latestReceiveDate: Date
  """Já líquido dos estornos: é o que cai no próximo fechamento."""
  totalReceivable: Decimal!
  totalReceived: Decimal!
  totalPending: Decimal!
  countReceivable: Int!
  """Total (negativo) a devolver por calote do cliente."""
  totalChargeback: Decimal!
  """Estornos do vendedor, incluindo os já agendados."""
  totalSellerChargeback: Decimal!
  """Estornos do vendedor sem mês de desconto escolhido — a fila do escritório."""
  totalSellerChargebackPending: Decimal!
  """Quantos boletos estão vencidos e não pagos."""
  countOverdue: Int!
  """Devoluções a fazer: o cliente pagou depois de um estorno já descontado."""
  totalRefund: Decimal!
  """A parte da devolução que volta para o vendedor."""
  totalSellerRefund: Decimal!
}

"""Quanto uma baixa em lote por período pegaria (sem gravar nada)."""
type SettleInstallmentsPreviewType {
  count: Int!
  amount: Decimal!
}

extend type Query {
  orders(input: BaseListInput!): OrderTypeConnectionResponse!
  """Prévia da baixa em lote: quantos boletos em aberto vencem no período e quanto somam."""
  settleInstallmentsPreview(
    dueFrom: Date!
    dueTo: Date!
    factoryId: UUID = null
    sellerId: UUID = null
  ): SettleInstallmentsPreviewType!
  order(id: UUID!): OrderTypeDataResponse!
  """Resumo dos pedidos. Aceita os MESMOS filtros da query `orders` (a paginação é ignorada); sem `input`, resume a empresa inteira."""
  orderStats(input: BaseListInput = null): OrderStatsType!
  """
  Linhas de comissão da carteira. `from`/`to` recortam pela data em que a
  comissão CAI — a tela abre um mês por vez e não precisa do histórico inteiro.
  O estorno do vendedor vem junto mesmo fora do período — o painel dele não
  segue mês nem aba. Boleto travado só com `includeOverdue`, que é o recorte da
  aba "Boleto em atraso" (todos os vencimentos de uma vez). Sem o período,
  devolve tudo. Os totais somam sempre a carteira inteira.
  """
  commissions(
    status: String = null
    factoryId: UUID = null
    sellerId: UUID = null
    from: Date = null
    to: Date = null
    includeOverdue: Boolean = false
  ): CommissionSummaryType!
}

extend type Mutation {
  createOrder(input: CreateOrderInput!): OrderTypeDataResponse!
  updateOrder(id: UUID!, input: UpdateOrderInput!): OrderTypeDataResponse!
  deleteOrder(id: UUID!): BaseResponse!
  invoiceOrder(id: UUID!, input: InvoiceOrderInput!): OrderTypeDataResponse!
  """Corrige os dados de um faturamento já lançado (data, prazo, previsão e data de entrega), refazendo as parcelas quando a data ou o prazo mudam."""
  reviseOrderInvoice(id: UUID!, input: ReviseOrderInvoiceInput!): OrderTypeDataResponse!
  """Desfaz o faturamento para lançá-lo de novo: apaga as parcelas, traz o restante (backorder) de volta ao pedido e devolve o status para CONFIRMADO. `force` autoriza apagar baixas de pagamento/comissão já lançadas."""
  uninvoiceOrder(id: UUID!, force: Boolean = false): OrderTypeDataResponse!
  """Confirma a entrega de um pedido faturado: status → DELIVERED e reabastece o estoque do cliente usando a data real de chegada."""
  markOrderDelivered(id: UUID!, deliveredAt: Date!): OrderTypeDataResponse!
  payOrderInstallment(id: UUID!, paidAt: Date!): OrderInstallmentTypeDataResponse!
  """Marca vários boletos como pagos de uma vez, conferindo o relatório da fábrica."""
  payOrderInstallments(installmentIds: [UUID!]!, paidAt: Date!): BaseResponse!
  """
  Baixa TODOS os boletos em aberto que vencem no período — o atalho para colocar
  o histórico em dia depois de subir pedidos antigos. `paidAt` nulo baixa cada
  boleto no próprio vencimento (preserva a cronologia); com data, todos recebem
  a mesma. Ignora parcela paga, cancelada, inadimplente ou com comissão já
  recebida.
  """
  settleInstallmentsInPeriod(
    dueFrom: Date!
    dueTo: Date!
    factoryId: UUID = null
    sellerId: UUID = null
    paidAt: Date = null
  ): BaseResponse!
  cancelOrderInstallment(id: UUID!): OrderInstallmentTypeDataResponse!
  """Calote: o cliente não pagou. Se a comissão já tinha sido paga, vira estorno."""
  markOrderInstallmentsDefaulted(installmentIds: [UUID!]!, defaultedAt: Date!): BaseResponse!
  revertOrderInstallment(id: UUID!): OrderInstallmentTypeDataResponse!
  markCommissionReceived(installmentIds: [UUID!]!, receivedAt: Date!): BaseResponse!
  """Desfaz o recebimento lançado por engano (ou glosado pela fábrica depois). Não mexe na conferência."""
  unmarkCommissionReceived(installmentIds: [UUID!]!): BaseResponse!
  """Registra que o escritório repassou ao vendedor a fatia dele."""
  markSellerCommissionPaid(installmentIds: [UUID!]!, paidAt: Date!): BaseResponse!
  """Desfaz o repasse ao vendedor; cancela junto o estorno que estivesse agendado."""
  unmarkSellerCommissionPaid(installmentIds: [UUID!]!): BaseResponse!
  """Escolhe em que mês o escritório desconta do vendedor o estorno de um calote (nulo devolve à fila)."""
  scheduleSellerChargeback(installmentIds: [UUID!]!, month: Date): BaseResponse!
  """Registra que a fábrica já descontou o estorno: ele vira histórico e sai do fechamento."""
  markChargebackSettled(installmentIds: [UUID!]!, settledAt: Date!): BaseResponse!
  """Registra que o escritório já descontou o estorno do vendedor (exige mês agendado)."""
  markSellerChargebackSettled(installmentIds: [UUID!]!, settledAt: Date!): BaseResponse!
  """Encerra a devolução da fábrica: o cliente pagou e o estorno descontado voltou."""
  markChargebackRefunded(installmentIds: [UUID!]!): BaseResponse!
  """Encerra a devolução ao vendedor: o valor descontado dele voltou."""
  markSellerChargebackRefunded(installmentIds: [UUID!]!): BaseResponse!
  setCommissionReconciled(installmentIds: [UUID!]!, reconciled: Boolean!): BaseResponse!
}

# Console da plataforma — tudo aqui é exclusivo do super usuário (SU).
#
# É o único recorte do schema que lê por cima dos tenants: enquanto o resto da
# API responde sempre dentro de uma empresa, estas operações somam, comparam e
# governam todas elas. Os resolvers são `@is_authenticated @is_super_user` sem
# exceção, e nenhum usa `@requires_company_context` — o `company_id` do token
# do SU é o da empresa em que ele está ancorado, não um recorte de leitura.

"""Ação de plataforma registrada na trilha do SU. Declarada desde já porque a
tabela `platform_audit_logs` grava esses valores — a leitura da trilha entra
com as telas de auditoria."""
enum PlatformAuditAction {
  PROVISION_COMPANY
  SUSPEND_COMPANY
  REACTIVATE_COMPANY
  UPDATE_PLAN
  ISSUE_ACCESS_LINK
  IMPERSONATE_USER
  """Governança da própria equipe — as duas ações que o suporte não executa, e
  as mais sensíveis da trilha: criam e revogam quem enxerga todas as empresas."""
  CREATE_PLATFORM_USER
  SET_PLATFORM_USER_STATUS
}

"""Desfecho de uma execução de job agendado. `RUNNING` que não sai desse estado
é o sintoma de job morto no meio."""
enum JobRunStatus {
  RUNNING
  SUCCESS
  FAILED
  """Lock ocupado: o job acordou e não trabalhou. Uma ou outra é normal (duas
  instâncias acordando juntas); todas puladas significa que o trabalho nunca
  acontece — e é um silêncio que se parece com saúde."""
  SKIPPED
}

"""Números da plataforma inteira. Os campos `...InPeriod` respeitam a janela
pedida; os totais são absolutos."""
type PlatformOverviewType {
  totalCompanies: Int!
  activeCompanies: Int!
  suspendedCompanies: Int!
  trialCompanies: Int!
  newCompaniesInPeriod: Int!

  totalUsers: Int!
  """Usuários que entraram pelo menos uma vez dentro da janela."""
  activeUsersInPeriod: Int!
  """Contas que nunca fizeram login — provisionadas e não usadas."""
  neverLoggedUsers: Int!
  """Empresas com pelo menos um login na janela: o corte entre cliente vivo e
  cadastro parado."""
  engagedCompanies: Int!

  totalSellers: Int!
  totalClients: Int!
  """Vínculos empresa↔fábrica ativos — não é o número de fábricas distintas."""
  totalFactoryLinks: Int!

  totalOrders: Int!
  ordersInPeriod: Int!
  """Soma dos pedidos confirmados, faturados e entregues na janela. Orçamento e
  cancelado ficam de fora, como no dashboard do tenant."""
  gmvInPeriod: Decimal!
}

type PlatformOverviewTypeDataResponse {
  status: Boolean!
  code: Int!
  message: String!
  data: PlatformOverviewType
}

"""Um mês da série de crescimento. Mês sem movimento não vem na lista."""
type PlatformGrowthPointType {
  month: String!
