  """
  visitPromotionPreview(itemId: UUID!, targetDate: Date = null): VisitPromotionPreviewType!
}

"""Origem da lista de produtos de uma fábrica na visita."""
enum StockCandidateSource {
  """Produtos do último pedido do cliente naquela fábrica."""
  LAST_ORDER
  """Sem pedido: produtos com estoque acompanhado."""
  TRACKED
  """Nada a observar ainda; a fábrica aparece para o vendedor abrir a primeira venda."""
  NO_PRODUCTS
}

type VisitStockCandidateProductType {
  id: UUID!
  name: String!
  sku: String
  """
  Dias desde o esgotamento estimado. Negativo = ainda dura. Nulo = produto sem
  estoque acompanhado (não há o que confirmar, só o que descobrir).
  """
  daysSinceStockout: Int
  """
  Lastro do número acima: `confirmado` | `historico` | `fraco` | `sem_lastro`.
  A tela usa para dizer "estimado" em vez de afirmar ruptura.
  """
  signalConfidence: String
  """
  Vale perguntar por este: o número dele não tem lastro E ele manda na urgência
  do cliente. Confirmar produto que não move o score gasta a paciência do
  cliente à toa — e é assim que o vendedor abandona o formulário na décima
  quinta linha. Vem no topo da lista.
  """
  isDecisive: Boolean!
}

type VisitStockCandidateGroupType {
  sellerClientFactoryId: UUID!
  factory: FactoryType
  """Vendedor e cliente do vínculo — o pedido desta fábrica é lançado com eles."""
  sellerId: UUID!
  clientId: UUID!
  """Esta fábrica motivou a visita (score alto)."""
  isFocus: Boolean!
  source: StockCandidateSource!
  lastOrderDate: Date
  products: [VisitStockCandidateProductType!]!
}

