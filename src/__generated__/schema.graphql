"""Modalidade de frete. FOB: por conta do cliente. CIF: entrega pela fábrica."""
enum FreightType {
  FOB
  CIF
}

enum OrderStatus {
  DRAFT
  SENT
  CONFIRMED
  INVOICED
  DELIVERED
  CANCELLED
}

type OrderType {
  id: UUID!
  companyId: UUID!
  sellerId: UUID!
  clientId: UUID!
  factoryId: UUID!
  orderDate: Date!
  totalAmount: Decimal!
  """IPI acumulado do pedido. Total pago pelo cliente = totalAmount + ipiAmount."""
  ipiAmount: Decimal!
  """Imposto embutido agregado (soma do taxAmount dos itens). Informativo, para exibir o total com imposto; não entra na base da comissão."""
  taxAmount: Decimal!
  commissionAmount: Decimal!
  status: OrderStatus!
  paymentTermId: UUID
  invoicedAt: Date
  """Número da nota fiscal emitida pela fábrica. É por ele que a planilha de comissão da fábrica identifica o pedido. Nulo quando ainda não informado."""
  invoiceNumber: String
  """Data em que a mercadoria chegou na loja do cliente. Nulo até confirmar a entrega; é quando o estoque do cliente é reabastecido."""
  deliveredAt: Date
  """Prazo de entrega estimado em dias (herda o padrão da fábrica). Nulo = sem previsão."""
  deliveryEstimateDays: Int
  """
  Quantos dias o vendedor estima que este pedido dura na loja do cliente. É o
  dado mais barato de coletar do sistema — uma pergunta no fechamento — e o que
  permite prever a próxima visita sem depender do estoque produto a produto.
  Vale como HIPÓTESE: quando contradiz a recorrência real dos pedidos daquele
  cliente, a recorrência vence e a divergência é mostrada ao vendedor.
  """
  coverageDays: Int
  """Data prevista de entrega = invoicedAt + deliveryEstimateDays. Nulo se não faturado ou sem estimativa."""
  estimatedDeliveryDate: Date
  """Faturado, prazo previsto vencido e ainda não entregue — precisa confirmar a entrega para atualizar o estoque."""
  isDeliveryOverdue: Boolean!
  """Visita que originou o pedido; nulo quando lançado fora de uma visita."""
  visitScheduleItemId: UUID
  """Pedido-pai quando ESTE é o restante (backorder) de um faturamento parcial; nulo nos pedidos normais."""
  parentOrderId: UUID
  """Este pedido é o restante (backorder) de um faturamento parcial de outro pedido."""
  isBackorder: Boolean!
  """Pedido-pai deste backorder (o que foi faturado parcial e gerou este restante)."""
  parentOrder: OrderType
  """Pedidos-filhos (backorders) gerados por faturamentos parciais deste pedido."""
  backorderChildren: [OrderType!]!
  freightType: FreightType
  fileUrl: String
  isFileParsed: Boolean!
  notes: String
  createdAt: DateTime!
  updatedAt: DateTime!
  deletedAt: DateTime
  seller: SellerType
  client: ClientType
  factory: FactoryType
  paymentTerm: FactoryPaymentTermType
  installments: [OrderInstallmentType!]!
  importLogs: [ImportLogType!]!
  """Base de cálculo da comissão da fábrica (Faturamento/Pagamento) para este pedido."""
  commissionCalcBasis: String
  """De onde contam os dias do boleto nesta fábrica: "Faturamento" (padrão) ou "Pedido"."""
  installmentDueBasis: String
  """Prazos de pagamento disponíveis da fábrica deste pedido (para faturar)."""
  availablePaymentTerms: [FactoryPaymentTermType!]!
  """A fábrica deste pedido cobra o IPI no pedido (por item), não na tabela de preços."""
  ipiInOrder: Boolean!
}

