enum StockObservation {
  OUT_OF_STOCK
  LOW
  ADEQUATE
  HIGH
}

"""Como o vendedor toca o cliente nesta parada da rotina."""
enum VisitContactType {
  """Visita presencial: ocupa vaga de deslocamento e entra no mapa do dia."""
  IN_PERSON
  """Ligação ou WhatsApp — o canal é escolha do vendedor, a regra é a mesma."""
  REMOTE
}

enum VisitOutcome {
  SOLD
  NOT_BOUGHT
  RESCHEDULED
  CLOSED
  """O cliente pediu uma visita presencial — vai para o topo da próxima rotina."""
  WANTS_VISIT
  """O cliente dispensou a visita agora — a próxima procura é adiada um ciclo."""
  NO_VISIT_NEEDED
}

enum VisitStatus {
  PENDING
  COMPLETED
  CLIENT_ABSENT
  NO_TIME
  RESCHEDULED
  CANCELLED
  """Ocorrência de rota fixa que não vai acontecer porque o próprio cliente pediu para não ser procurado nesta data. Fica registrada e devolve a vaga do dia ao motor."""
  SKIPPED_BY_CUSTOMER
}

