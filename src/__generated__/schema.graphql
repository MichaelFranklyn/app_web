"""
O que está pendente e por quê — a leitura do sistema sobre o que fazer para
vender mais.

Cada insight é uma PENDÊNCIA contável, não um texto: o backend responde quantos
casos existem, quanto dinheiro está envolvido e alguns exemplos; o rótulo, a
explicação e a ação ficam do lado da tela (mesma divisão de `FEATURE_LABEL`).
"""
enum InsightKind {
  """Clientes que passaram do PRÓPRIO ritmo de compra."""
  CLIENT_OVERDUE
  """Cliente com score alto que ficou fora da rotina da semana."""
  PRIORITY_OFF_ROUTE
  """Vínculo cuja visita venceu a frequência combinada."""
  VISIT_OVERDUE
  """Clientes na carteira sem nenhuma visita nos últimos 30 dias."""
  NO_VISIT_30D
  """Rascunho ou orçamento parado há dias, sem virar pedido."""
  DRAFT_STALE
  """Pedido confirmado que a fábrica ainda não faturou."""
  PENDING_INVOICE
  """Pedido faturado cujo prazo de entrega venceu sem confirmação."""
  DELIVERY_UNCONFIRMED
  """Boleto vencido e não pago."""
  INSTALLMENT_OVERDUE
  """Meta do mês cujo realizado está atrás do ritmo necessário."""
  GOAL_BEHIND
}

enum InsightGroup {
  """Quem visitar e quem está sumindo."""
  WALLET
  """Pedido que empacou no meio do caminho."""
  ORDERS
  """Dinheiro que ainda não entrou."""
  MONEY
  """O combinado do mês."""
  GOALS
}

"""
Por que um cliente prioritário não entrou na rotina.

Os quatro primeiros são exclusões DELIBERADAS do motor de rotina (ver
`route_reasons`): o cliente não foi esquecido, foi descartado por uma regra — e
o que destrava cada um é diferente. Só `NO_ROOM` representa uma decisão do
vendedor a revisar, e por isso é o único que entra na contagem do cartão.
"""
enum InsightCaseReason {
  """Tem pedido em aberto nessa fábrica — o motor não recomenda visita até a entrega."""
  ORDER_OPEN
  """Já tem visita presencial marcada em alguma rotina."""
  VISIT_PENDING
  """O cliente pediu para não ser procurado agora."""
  DEFERRED
  """Sem coordenada no mapa: sem endereço geocodificado não se monta rota."""
  NO_GEOCODE
  """Nenhuma regra o excluiu — não coube na semana."""
  NO_ROOM
}

"""Um caso concreto do insight — o que a pessoa vai abrir para resolver."""
type InsightSampleType {
  id: UUID!
  label: String!
  """Complemento curto: dias de atraso, valor, nome da fábrica."""
  detail: String
  """Rota do registro, quando ele tem tela própria."""
  link: String
  """
  Por que o sistema já explica este caso. Nulo quando não há explicação — aí o
  caso depende de uma decisão de quem lê.
  """
  reason: InsightCaseReason
}

type InsightType {
  kind: InsightKind!
  group: InsightGroup!
  """
  Quantos casos dependem de uma decisão de quem lê. NÃO é o total: os casos que
  o próprio sistema explica ficam em `blockedCount`.
  """
  count: Int!
  """
  Casos que existem mas cuja ausência o sistema já justifica (ver
  `InsightCaseReason`). Somados a `count`, dão o total da lista completa.
  """
  blockedCount: Int!
  """Dinheiro envolvido, quando a pendência tem valor (nulo quando não tem)."""
  amount: Decimal
  """Dias úteis que ainda restam no mês — só faz sentido em GOAL_BEHIND."""
  daysLeft: Int
  """Até três exemplos, para a tela mostrar de quem está falando."""
  samples: [InsightSampleType!]!
}

"""Uma página da lista completa de um insight — o que há por trás do "e mais N"."""
type InsightCasesType {
  kind: InsightKind!
  """Total de casos da pendência (`count` + `blockedCount` do cartão)."""
  totalCount: Int!
  cases: [InsightSampleType!]!
}

type InsightCasesDataResponse {
  status: Boolean!
  code: Int!
  message: String!
  data: InsightCasesType
}

type InsightsOverviewType {
  """Quando a leitura foi feita (os números são calculados na hora)."""
  generatedAt: DateTime!
  """Só os insights com pelo menos um caso — pendência zerada não vira cartão."""
  insights: [InsightType!]!
}

type InsightsOverviewDataResponse {
  status: Boolean!
  code: Int!
  message: String!
  data: InsightsOverviewType
}

