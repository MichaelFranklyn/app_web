name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Necessária em build/runtime: helpersCookie.ts lança se ela não existir.
# Valor dummy — os testes E2E mockam o GraphQL e não validam o token.
env:
  NEXT_PUBLIC_COOKIE_SECRET_KEY: ci-e2e-cookie-secret

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  # A suíte unitária INTEIRA, sempre — dividida em 2 máquinas (`--shard`) só
  # para não virar o caminho crítico do PR depois que o E2E foi dividido. Não
  # se filtra por arquivo aqui: o filtro por import não enxerga o que não é
  # import (o contrato com o schema GraphQL, por exemplo).
  unit-shard:
    name: Unit shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/2

  # O NOME que a proteção da main exige para lint + unit (ver o job `e2e`).
  unit:
    name: Lint + Unit (vitest)
    needs: [lint, unit-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "lint: ${{ needs.lint.result }} · unit: ${{ needs.unit-shard.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.unit-shard.result }}" = "success"

  # O PR precisa de E2E? Não precisa quando TUDO o que mudou é texto (.md) ou
  # teste unitário (*.test.ts[x] em src/): nenhum dos dois entra no build que o
  # Playwright testa. Qualquer outra coisa — inclusive os próprios specs em e2e/
  # — roda a suíte. No push da main roda sempre.
  changes:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.decide.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Os SHAs do EVENTO, e não `origin/main...HEAD`: a main de agora pode
          # já conter este PR (merge feito com o CI ainda rodando), e aí a
          # comparação dava vazia e o E2E era dispensado sem motivo.
          changed=$(git diff --name-only \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "$changed"
          if [ -z "$changed" ]; then
            # Nada a comparar não é "só .md": na dúvida, roda.
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          relevant=$(echo "$changed" | grep -vE '\.md$|^src/.*\.test\.tsx?$' || true)
          if [ -n "$relevant" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "Só .md e testes unitários mudaram: E2E dispensado."
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  # A suíte dividida em 3 máquinas em paralelo (`--shard`). Cada uma faz o
  # próprio build (o webServer do Playwright), por isso o cache do Next abaixo
  # importa: sem ele, dividir economizava só o tempo dos testes.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      # Um shard falhar não cancela os outros: o relatório de cada um é o que
      # mostra se a falha é uma só ou se espalhou.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # O `--with-deps` roda apt-get e é o passo mais lento e mais instável do
      # job (já pendurou >12min baixando fontes do mirror). Com o browser em
      # cache, nada disso precisa rodar de novo: a imagem do runner já traz as
      # libs de sistema do Chromium, e as fontes que o apt acrescenta (CJK,
      # emoji) nenhum teste usa.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache incremental do `next build` (o E2E builda em .next-e2e). A chave
      # exata muda a cada mudança de código; o `restore-keys` recupera o cache
      # mais recente das mesmas dependências, e o Next reaproveita o que não
      # mudou — é assim que ele recomenda cachear em CI.
      - uses: actions/cache@v4
        with:
          path: .next-e2e/cache
          key: next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: |
            next-e2e-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # webServer faz o build de produção isolado e sobe o app; globalSetup sobe
      # o stub GraphQL. CI=true (automático) força reuseExistingServer:false.
      # O projeto `setup` (login) roda em cada shard: é dependência dos specs.
      - run: npm run e2e -- --shard=${{ matrix.shard }}/3
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7

  # O NOME que a proteção da main exige. Os shards têm nomes próprios, então é
  # este job que responde por eles: verde quando todos passaram, ou quando o E2E
  # foi dispensado (PR só de .md/teste unitário). Sem ele, a mudança para shards
  # deixaria o check obrigatório "E2E (Playwright)" pendente para sempre e
  # nenhum PR poderia ser mergeado.
  e2e:
    name: E2E (Playwright)
    needs: [changes, e2e-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "detecção: ${{ needs.changes.result }} · shards: ${{ needs.e2e-shard.result }}"
          if [ "${{ needs.changes.result }}" != "success" ]; then exit 1; fi
          case "${{ needs.e2e-shard.result }}" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
