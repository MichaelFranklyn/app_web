name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Necessária em build/runtime: helpersCookie.ts lança se ela não existir.
# Valor dummy — os testes E2E mockam o GraphQL e não validam o token.
env:
  NEXT_PUBLIC_COOKIE_SECRET_KEY: ci-e2e-cookie-secret

jobs:
  unit:
    name: Lint + Unit (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # O `--with-deps` roda apt-get e é o passo mais lento e mais instável do
      # job (já pendurou >12min baixando fontes do mirror). Com o browser em
      # cache, nada disso precisa rodar de novo: a imagem do runner já traz as
      # libs de sistema do Chromium, e as fontes que o apt acrescenta (CJK,
      # emoji) nenhum teste usa.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # webServer faz o build de produção isolado e sobe o app; globalSetup sobe
      # o stub GraphQL. CI=true (automático) força reuseExistingServer:false.
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
